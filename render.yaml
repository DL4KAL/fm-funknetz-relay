services:
  - type: web
    name: fm-funknetz-relay
    env: python
    region: frankfurt  # Wähle eine Region in der Nähe (z.B. frankfurt oder ohio)
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
